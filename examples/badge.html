<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>数据徽章 · artplayer-plugin-p2p</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; max-width: 860px; margin: 0 auto; padding: 24px; background: #101014; color: #E8EAF0; }
    #player { width: 100%; aspect-ratio: 16 / 9; border-radius: 8px; overflow: hidden; }
    .row { display: flex; gap: 12px; margin: 16px 0; }
    button { padding: 8px 16px; border-radius: 6px; border: 1px solid #3A3F4B; background: #1A1D24; color: #E8EAF0; cursor: pointer; }
    code { color: #8AB4FF; }
  </style>
</head>
<body>
  <h1>数据徽章</h1>
  <p>
    <code>badge: true</code> 在播放器右上角挂载单行速览徽章。点击徽章原地展开三行轻量详情
    （Peers 峰值 / P2P 占比 / 累计流量），再点收起；键盘 Tab 聚焦后 Enter 或空格同效。
    徽章显隐由设置面板「P2P 统计」开关或下方按钮控制，隐藏时自动收起展开态。
  </p>
  <div id="player"></div>
  <div class="row">
    <button id="btn-badge">toggle 徽章显隐</button>
    <button id="btn-p2p">toggle P2P 加速</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/artplayer@5.4.0/dist/artplayer.js"></script>
  <script src="vendor/artplayer-plugin-p2p.iife.js"></script>
  <script>
    const art = new Artplayer({
      container: '#player',
      url: 'https://fcc3ddae59ed.us-west-2.playback.live-video.net/api/video/v1/us-west-2.893648527354.channel.DmumNckWFTqz.m3u8',
      type: 'm3u8',
      autoplay: true,
      muted: true,
      playsInline: true,
      setting: true,
      plugins: [
        artplayerPluginP2P({
          badge: true,
        }),
      ],
    })
    const handle = art.plugins.artplayerPluginP2P

    document.getElementById('btn-badge').addEventListener('click', () => {
      handle.setBadgeVisible(!handle.isBadgeVisible())
    })
    document.getElementById('btn-p2p').addEventListener('click', () => {
      handle.setP2PEnabled(!handle.isP2PEnabled())
    })

    // 也可订阅统计心跳自行消费（1Hz 推送快照，与徽章同源同拍）
    handle.onStatsTick((snapshot) => {
      document.title = 'peers ' + snapshot.peers + ' · ' + Math.round(snapshot.p2pDownloadRatio * 100) + '%'
    })
  </script>
</body>
</html>
